name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  toolchains:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build toolchains
        run: ./pleasew build //third_party/node:node //third_party/bun:bun
      - name: Test toolchains
        run: ./pleasew test //test/...
      - name: Format
        run: ./pleasew format
      - name: Check formatting
        run: git diff --exit-code
